# Dataholics — cross-bank AML via federated learning — IBM Z Datathon 2026
# One image ("fedaml", built from ./Dockerfile by INFRA), one service per role.
# Default profile:  docker compose up            -> coordinator, bank1..bank4, rogue, dashboard
# Tools profile:    docker compose run --rm attacker | genai | alerts | baselines | tryleak   (llm starts with genai)
# Toggles (env, all optional):  ROUNDS BANKS EVAL_BANKS DP DP_MODE SIGMA CLIP DEFENSE TAU TAG EPOCHS TRAINER ROGUE_ATTACK ROGUE_FACTOR SEED
#   e.g.  DP=off DEFENSE=off docker compose up           (the "unprotected" run)
#         DP=on  DEFENSE=on  docker compose up           (the demo run; defaults)
# Volumes: ./data (read-only shards), ./state (models + status JSON), ./logs (egress audit).
# Nothing is published to the internet: host ports bind 127.0.0.1 only; reach via `ssh -L`.

name: fedaml

x-common: &common
  image: fedaml
  build:
    context: .
    dockerfile: Dockerfile          # INFRA owns the Dockerfile (ubuntu:24.04 + apt python3-*)
  working_dir: /app
  environment:
    PYTHONPATH: /app
    PYTHONUNBUFFERED: "1"
    SEED: ${SEED:-42}
  volumes:
    - ./data:/app/data:ro
    - ./state:/app/state
    - ./logs:/app/logs
  restart: "no"
  init: true
  # TODO(MASTER, after INFRA footprint run): add mem_limit per service if docker stats shows pressure (8 GB box).

x-bank: &bank
  <<: *common
  depends_on:
    coordinator:
      condition: service_healthy
  # Banks: data stays in the container; only clipped+noised deltas leave through fedaml.egress.send.
  # FEDERATION 15:30 (bank.py): DP/clip come from GET /config; retries the coordinator for --connect-timeout 120 s; --trainer prox|lbfgs|sgd (env TRAINER), --mu (env MU).

services:

  coordinator:
    <<: *common
    container_name: coordinator
    # FEDERATION flags verified 15:30 (fedaml/coordinator.py): --host defaults 0.0.0.0, --seed, --tag, --eval-banks, --tau, --round-timeout, --linger.
    # TAG names the run: dpoff | dpon | rogue_off | rogue_on  -> state/global_final_<tag>.json + state/status_<tag>.json (MASTER decision 15:30)
    # TAU 1.5 (FEDERATION 5f93293, real shards): honest banks 2-4 cosine-distance-to-median 0.02-0.32, honest bank 1 0.94-1.33 (orthogonal, unlearnable data),
    # scaled rogue 1.84 (opposed). tau 1.5 excludes updates that OPPOSE the consensus, not banks that merely disagree.
    command: >
      python3 -m fedaml.coordinator
      --rounds ${ROUNDS:-10}
      --banks ${BANKS:-1,2,3,4,5}
      --eval-banks ${EVAL_BANKS:-2,3,4}
      --dp ${DP:-on}
      --dp-mode ${DP_MODE:-local}
      --sigma ${SIGMA:-0.3}
      --clip ${CLIP:-1.0}
      --defense ${DEFENSE:-on}
      --tau ${TAU:-1.5}
      --round-timeout ${ROUND_TIMEOUT:-120}
      --tag "${TAG:-}"
      --seed ${SEED:-42}
    # No-rogue run: BANKS=1,2,3,4 docker compose up --scale rogue=0
    # DP_MODE local (MASTER 16:20): banks add the noise BEFORE egress.send, so the coordinator never sees an un-noised update.
    #   central (DP-FedAvg) is available but is not the story: REDTEAM's auditing game shows the coordinator reads membership at AUC 0.86-0.94 from un-noised updates.
    # EVAL_BANKS default 2,3,4 (MASTER 15:55): bank 1 trains but is unlearnable with per-row features; reported per bank only.
    ports:
      - "127.0.0.1:8000:8000"       # host-only, for curl debugging through an SSH tunnel
    healthcheck:
      # No curl in the image; use stdlib. Status endpoint per CONTRACTS §4.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  bank1:
    <<: *bank
    container_name: bank1
    command: python3 -m fedaml.bank --bank-id 1 --coordinator http://coordinator:8000 --epochs ${EPOCHS:-1} --seed ${SEED:-42}

  bank2:
    <<: *bank
    container_name: bank2
    command: python3 -m fedaml.bank --bank-id 2 --coordinator http://coordinator:8000 --epochs ${EPOCHS:-1} --seed ${SEED:-42}

  bank3:
    <<: *bank
    container_name: bank3
    command: python3 -m fedaml.bank --bank-id 3 --coordinator http://coordinator:8000 --epochs ${EPOCHS:-1} --seed ${SEED:-42}

  bank4:
    <<: *bank
    container_name: bank4
    command: python3 -m fedaml.bank --bank-id 4 --coordinator http://coordinator:8000 --epochs ${EPOCHS:-1} --seed ${SEED:-42}

  rogue:
    <<: *bank
    container_name: rogue
    # Addition #4: the 5th bank poisons its updates to hide its own laundering. Synthetic attack; say so in the demo.
    command: >
      python3 -m fedaml.rogue --bank-id 5 --coordinator http://coordinator:8000
      --attack ${ROGUE_ATTACK:-scale} --factor ${ROGUE_FACTOR:--20}
      --epochs ${EPOCHS:-1} --seed ${SEED:-42}
    # FEDERATION 15:30: rogue.py reuses bank.add_common_args (so --epochs/--seed/--trainer work) + --attack scale|flip|none --factor --claim-factor.

  dashboard:
    <<: *common
    container_name: dashboard
    command: python3 -m fedaml.dashboard --port 8050
    # AUDIT 13:00: dashboard binds 0.0.0.0 automatically when /.dockerenv exists; host side is 127.0.0.1 below.
    #              Reach from the Mac: ssh -L 8050:localhost:8050 dataholics  ->  http://localhost:8050
    ports:
      - "127.0.0.1:8050:8050"
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./state:/app/state:ro
      - ./logs:/app/logs:ro

  # ---------------------------------------------------------------- tools profile (run on demand)

  attacker:
    <<: *common
    container_name: attacker
    profiles: ["tools"]
    # Membership-inference red team: DP off vs DP on (CONTRACTS §7). Must finish < 2 min on the VM.
    command: >
      python3 -m fedaml.redteam
      --model-off ${MODEL_OFF:-state/global_final_dpoff.json}
      --model-on  ${MODEL_ON:-state/global_final_dpon.json}
      --seed ${SEED:-42}
    # REDTEAM 12:50: flags confirmed (--model-off --model-on --seed; also --attack auto|loss_threshold|shadow|art, --n 20000).

  llm:
    # GENAI (accepted by MASTER 13:10): llama.cpp built from source for s390x, serves a big-endian GGUF on :8080.
    # One-off weights fetch (676 MB, stays out of the image):  docker compose run --rm llm /app/fetch_model.sh
    # Without weights this container exits 1; genai then falls back to the template engine (depends_on required: false).
    # RAM ~0.7 GB + KV cache: do NOT run while the five banks train; start it for scene 6 only.
    image: fedaml-llm
    build:
      context: .
      dockerfile: fedaml/llm/Dockerfile
    container_name: llm
    profiles: ["tools"]
    volumes:
      - ./models:/models
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LLM_THREADS: ${LLM_THREADS:-3}
      LLM_CTX: ${LLM_CTX:-2048}
      # default 0.5B (~10 s/SAR, 124 MB) for anything live; the recorded demo SARs use 1.5B (~41 s/SAR, 661 MB), both in ./models:
      #   LLM_MODEL_FILE=qwen2.5-1.5b-instruct-q8_0-be.gguf docker compose up -d llm
      LLM_MODEL_FILE: ${LLM_MODEL_FILE:-qwen2.5-0.5b-instruct-q8_0-be.gguf}
    restart: "no"
    init: true

  genai:
    <<: *common
    container_name: genai
    profiles: ["tools"]
    # SAR writer. Usage: ALERT_ID=A07 docker compose run --rm genai   (ids A01..A20 from state/alerts.json; SAR_ENGINE=llm|template)
    # `--all` and `--list` also exist (fedaml.sar). Template fallback is automatic on LLM timeout (60 s) or hallucinated ids.
    # NOTE: no `${VAR:?}` guards anywhere: compose interpolates the whole file before applying profiles, so a guard breaks `docker compose up`.
    command: python3 -m fedaml.sar --alert-id ${ALERT_ID:-A01} --engine ${SAR_ENGINE:-template}
    # No depends_on on llm (GENAI ask, 15:58): template runs must never start the LLM. Sequence for LLM SARs:
    #   docker compose up -d --wait llm && SAR_ENGINE=llm ALERT_ID=A01 docker compose run --rm genai && docker compose stop llm
    # Default engine is template (always works, ~7 s); SAR_ENGINE=llm is explicit so nobody waits out the 60 s LLM timeout by accident.
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      SEED: ${SEED:-42}
      LLM_URL: ${LLM_URL:-http://llm:8080}
      LLM_THREADS: ${LLM_THREADS:-3}
    # Fallback if the fedaml-llm image will not build on the VM: run llama-server on the host
    # (~/llm/llama.cpp/build/bin/llama-server ... --host 0.0.0.0 --port 8080) and start genai with
    #   LLM_URL=http://host.docker.internal:8080 docker compose run --rm --no-deps genai
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alerts:
    <<: *common
    container_name: alerts
    profiles: ["tools"]
    # Top-20 flagged chains from the final global model -> state/alerts.json (MODELS, consumed by genai)
    command: python3 -m fedaml.alerts --model ${ALERTS_MODEL:-state/global_final.json} --top 20 --seed ${SEED:-42}
    # GENAI owns fedaml/alerts.py (flags verified 15:30: --test --model --out --top --max-rows --seed); MODELS' duplicate --alerts path was removed 13:15.

  tryleak:
    <<: *common
    container_name: tryleak
    profiles: ["tools"]
    # Demo hook: tries to push 5 raw rows through egress.send; must be BLOCKED and logged (AUDIT).
    command: python3 scripts/try_leak.py --coordinator http://coordinator:8000 --bank-id 1
    volumes:
      - ./data:/app/data:ro
      - ./state:/app/state
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    # AUDIT 12:50: flags confirmed (--bank-id --coordinator --variant rows|nested|oversize --logs-dir).
